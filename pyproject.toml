[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "db-ingest"
version = "0.1.0"
description = "Preservation-focused SQL Server delimited-file importer"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyodbc==5.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "hypothesis==6.142.4", "psutil==7.1.2", "pip-audit==2.9.0"]
xml = ["defusedxml==0.7.1"]

[project.scripts]
db-ingest = "db_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["db_ingest*"]

[tool.setuptools.package-data]
db_ingest = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
