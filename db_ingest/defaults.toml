# source_name = "CaseNumber"
# source_ordinal = 1                      # 1-based; disambiguates duplicate header names.
# target_name = "case_number"
# target_type = "nvarchar(80)"
# nullable = true
#
# [[file_rules.columns]]
# source_name = "Amount"
# source_ordinal = 4
# target_type = "decimal(19,4)"
# nullable = true
#
# [[file_rules.columns]]
# source_name = "OccurredAt"
# source_ordinal = 5
# target_type = "datetimeoffset(7)"
# temporal_format = "iso8601"
# timezone_policy = "preserve"
#
# [[file_rules.columns]]
# source_name = "Attachment"
# source_ordinal = 6
# target_type = "varbinary(max)"
# binary_encoding = "base64"
#
# XML/HTML scalar-field mappings must be concrete, documented and validated by the
# implemented adapters. Selecting a format alone never authorizes arbitrary flattening.

# Directory import presets (edit existing sections above; do not repeat section headers):
# Filename per CSV: mapping.table_strategy="per_file", mapping.name_collision="filename_error"
# Folder + filename: mapping.table_strategy="per_file", mapping.name_collision="path_error"
# Merge each folder: mapping.table_strategy="per_directory", mapping.name_collision="path_error"
# path_error joins relative folder/file names with one underscore: north/orders.csv -> north_orders.
# Merge uses direct files in each folder; nested folders form separate tables; root uses mapping.root_table.
# One-off import: load.mode="create_only" refuses existing targets; same-run recovery stays safe.
# Repeated feeds: load.mode="append"; intentional replacement: load.mode="replace".
