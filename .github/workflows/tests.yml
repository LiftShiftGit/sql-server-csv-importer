name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,xml]"
      - name: Local regression
        run: python -m pytest tests --ignore=tests/integration -q
      - name: Check public source package
        run: python scripts/package_source.py --output artifacts/db-ingest-source.zip
