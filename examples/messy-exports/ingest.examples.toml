# Run from the project root. This config only supplies parsing rules, not column types.
# plan is source-only; malformed examples intentionally produce non-clean outcomes.
[destination]
server = "127.0.0.1,14339"
database = "DbIngestTest_Examples"
control_database = "DbIngestTest_Examples_Control"
[source]
root = "examples/messy-exports"
path = "examples/messy-exports"
include = ["csv.csv", "tabbed.tsv", "pipe.txt", "semicolon.txt", "custom.txt", "no_header.csv", "duplicate.csv", "nulls.csv", "integer_boundaries.csv", "exact_types.csv", "unicode.csv", "utf8_bom.csv", "utf16.csv", "multiline.csv", "escape_rfc.csv", "escape_backslash.csv", "escape_unquoted.csv", "escape_single_quote.csv", "escape_multiline.csv", "escape_mixed_endings.csv", "escape_spaces.csv", "escape_trailing_empty.csv", "escape_literal_backslash.csv", "escape_nel_literal.csv", "dirty_ragged.csv", "dirty_postquote.csv", "dirty_blank.csv", "dirty_unclosed.csv", "dirty_dangling_escape.csv", "dirty_utf8.csv", "dirty_mixed_encoding.csv", "dirty_undefined_cp1252.csv", "dirty_truncated_utf16.csv", "dirty_nul.csv", "dirty_bom_conflict.csv", "encoding_ascii.csv", "encoding_cp1252.csv", "encoding_iso8859-1.csv", "encoding_iso8859-15.csv", "encoding_cp437.csv", "encoding_cp850.csv", "encoding_cp858.csv", "encoding_cp1250.csv", "encoding_cp1251.csv", "encoding_koi8-r.csv", "encoding_cp1253.csv", "encoding_cp1254.csv", "encoding_cp1255.csv", "encoding_cp1256.csv", "encoding_cp1257.csv", "encoding_cp1258.csv", "encoding_utf-8-sig.csv", "encoding_utf-16-le.csv", "encoding_utf-16-be.csv", "encoding_utf-32-le.csv", "encoding_utf-32-be.csv", "encoding_shift_jis.csv", "encoding_cp932.csv", "encoding_euc_jp.csv", "encoding_gb18030.csv", "encoding_gbk.csv", "encoding_big5.csv", "encoding_euc_kr.csv", "encoding_cp949.csv", "ebcdic_cp037_lf.csv", "ebcdic_cp037_crlf.csv", "ebcdic_cp037_nel.csv", "ebcdic_cp500_lf.csv", "ebcdic_cp500_crlf.csv", "ebcdic_cp500_nel.csv", "ebcdic_cp1140_lf.csv", "ebcdic_cp1140_crlf.csv", "ebcdic_cp1140_nel.csv", "ebcdic_multiline_nel.csv", "ebcdic_display_numbers.csv"]
[preservation]
work_directory = ".integration/messy-example-work"
minimum_free_disk_bytes = 1048576
[parallel]
enabled = false
[interaction]
non_interactive = true

[[file_rules]]
glob = "csv.csv"
encoding = "utf-8"
delimiter = ","
quotechar = "\""
header = "present"

[[file_rules]]
